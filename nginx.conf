events {}

http {
    # Адрес API внутри Docker-сети (имя сервиса из docker-compose.yml)
    upstream api_backend {
        server api:8080;
    }

    server {
        listen 80;

        # Все запросы перенаправляются к ASP.NET Core API
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Метрики снаружи не отдаём — их забирает Prometheus напрямую из Docker-сети
        location /metrics {
            return 403;
        }
    }
}
