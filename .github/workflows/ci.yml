name: CI

# Пайплайн запускается при каждом push и pull request
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Получение кода репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Установка .NET SDK.
      #    Проекты на .NET 8, а файл решения .slnx понимает только SDK 9.0.200 и новее, поэтому ставим оба
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # 3. Восстановление зависимостей (NuGet)
      - name: Restore
        run: dotnet restore ProductionSystem.slnx

      # 4. Сборка
      - name: Build
        run: dotnet build ProductionSystem.slnx --no-restore --configuration Release

      # 5. Автоматические тесты (xUnit)
      - name: Test
        run: dotnet test ProductionSystem.slnx --no-build --configuration Release --verbosity normal

      # Дополнительно: проверяем, что Docker-образ API собирается
      - name: Docker build
        run: docker build -t productionsystem-api ./ProductionSystem
